version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/forg
    binary: forg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/imgoomes/forgetful.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - name: forg
    repository:
      owner: imgoomes
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/imgoomes/forgetful"
    description: "Never forget a terminal command again."
    license: MIT
    install: |
      bin.install "forg"
    test: |
      system "#{bin}/forg", "--help"

release:
  github:
    owner: imgoomes
    name: forgetful
